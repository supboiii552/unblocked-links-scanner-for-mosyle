<!DOCTYPE html>
<html>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">
  <button onclick="check()" style="padding:10px 20px;font-size:16px;">run fixed scan</button>
  <div id="out" style="margin-top:20px;"></div>
  <script>
  async function check() {
    const out = document.getElementById('out');
    out.innerHTML = "fetching unsorted list...";
    const res = await fetch('https://yourworstnightmare1.github.io/proxy-list/unsorted.html');
    const text = await res.text();
    
    // extract and clean urls to strip trailing quotes/html tags
    const rawMatches = text.match(/https?:\/\/[^\s\)"']+/g) || [];
    const urls = [...new Set(rawMatches.map(u => u.replace(/["'>]/g, '')))];
    
    out.innerHTML = `scanning ${urls.length} cleaned links...<br><br>`;
    
    const batchSize = 10;
    for (let i = 0; i < urls.length; i += batchSize) {
      const batch = urls.slice(i, i + batchSize);
      await Promise.all(batch.map(async (u) => {
        let status = "WORKING";
        let color = "#0f0";
        try {
          const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(u);
          const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(4000) });
          const data = await r.json();
          const html = (data.contents || "").toLowerCase();
          if (!data.contents || html.includes("mosyle") || html.includes("blocked domain")) {
            status = "BLOCKED";
            color = "#f00";
          }
        } catch (err) {
          status = "DEAD";
          color = "#f00";
        }
        out.innerHTML += `<span style="color:${color};">[${status}] ${u}</span><br>`;
      }));
    }
  }
  </script>
</body>
</html>
