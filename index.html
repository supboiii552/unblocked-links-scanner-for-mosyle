<!DOCTYPE html>
<html>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">
  <button onclick="check()" style="padding:10px 20px;font-size:16px;">run text scan</button>
  <div id="out" style="margin-top:20px;"></div>
  <script>
  async function check() {
    const out = document.getElementById('out');
    out.innerHTML = "fetching list...";
    const res = await fetch('https://raw.githubusercontent.com/yourworstnightmare1/proxy-list/main/list.md');
    const text = await res.text();
    const urls = [...new Set(text.match(/https?:\/\/[^\s\)"']+/g) || [])];
    
    out.innerHTML = `scaning ${urls.length} links via text match...<br><br>`;
    
    for (let u of urls) {
      let status = "WORKING";
      let color = "#0f0";
      
      try {
        // use a public cors proxy or direct fetch to read text
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(u);
        const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(5000) });
        const data = await r.json();
        const html = (data.contents || "").toLowerCase();
        
        if (!data.contents || html.includes("mosyle") || html.includes("blocked domain")) {
          status = "MOSYLE BLOCKED";
          color = "#f00";
        }
      } catch (err) {
        status = "DOWN / DEAD";
        color = "#f00";
      }
      
      out.innerHTML += `<span style="color:${color};">[${status}] ${u}</span><br>`;
    }
  }
  </script>
</body>
</html>
